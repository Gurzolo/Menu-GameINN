<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quanti giocatori?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="brand-logo" aria-label="Game Inn logo">
        <div class="logo-hex">
          <div class="logo-inner">
            <div class="brand-text">
              <span class="brand-game">GAME</span>
              <span class="brand-inn">INN</span>
            </div>
            <div class="logo-icons">
              <span class="icon icon-1"></span>
              <span class="icon icon-2"></span>
              <span class="icon icon-3"></span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container home-container">
      <h1>Quanti giocatori?</h1>

      <div class="slider-wrap">
        <label for="playersRange" class="sr-only">Numero di giocatori</label>
        <input
          id="playersRange"
          type="range"
          min="1"
          max="12"
          step="1"
          value="4"
        />
        <div class="value-box">
          <span id="playersValue">4</span>
        </div>
      </div>

      <button id="confirmBtn" type="button">Conferma</button>
    </main>

    <script src="games-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
