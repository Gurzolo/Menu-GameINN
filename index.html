<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quanti giocatori?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container home-container">
      <h1>Menù dei giochi</h1>

      <div class="slider-wrap">
        <div class="value-box">
          <span id="playersValue">1</span>
        </div>
        <label for="playersRange" class="sr-only">Numero di giocatori</label>
        <input
          id="playersRange"
          type="range"
          min="1"
          max="12"
          step="1"
          value="1"
        />
      </div>

      <div class="toggle-group">
        <button
          id="toggleBoardGames"
          class="toggle-btn active"
          type="button"
          data-category="Giochi da tavola"
        >
          Giochi da tavolo
        </button>
        <button
          id="toggleVideoGames"
          class="toggle-btn active"
          type="button"
          data-category="Videogiochi"
        >
          Videogiochi
        </button>
      </div>

      <div class="home-actions">
        <button id="showAllGamesBtn" type="button" class="metal-btn">
          Vedi tutti i giochi
        </button>
        <button id="confirmBtn" type="button">Cerca</button>
      </div>
    </main>

    <script src="games-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
